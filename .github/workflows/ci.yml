name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ROOT_VERSION: 0.1.x-dev

    steps:
      - uses: actions/checkout@v4
        with:
          path: ui

      - uses: actions/checkout@v4
        with:
          repository: seviaflow/core
          ref: main
          path: core
          token: ${{ secrets.SEVIAFLOW_REPO_TOKEN || github.token }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Validate committed Composer manifest
        working-directory: ui
        run: composer validate --strict

      - name: Resolve PHP dependencies with CI-only Core checkout
        working-directory: ui
        run: |
          composer config repositories.seviaflow-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"seviaflow/core":"0.1.x-dev"}}}'
          composer update --no-interaction --prefer-dist

      - name: PHP quality gates
        working-directory: ui
        run: composer check

      - name: Frontend quality gates
        working-directory: ui
        run: |
          npm ci
          npm run build
          git diff --exit-code -- public/dist/seviaflow.css public/dist/seviaflow.js
